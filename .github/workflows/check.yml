name: Mod checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: FAF Lua compiler and mod tests
    runs-on: ubuntu-latest
    container: faforever/lua:v5.0-3
    steps:
      - name: Install tooling
        run: apk add bash git findutils
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Pick the projects to check
        shell: bash
        run: |
          # A pull request answers for its own projects. A push to main and a new Lua version check them all.
          echo My_mods/ > projects.txt
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git diff --name-only --no-renames "origin/$GITHUB_BASE_REF...HEAD" > changed.txt
            if ! grep -qx DOCUMENTATION/tools/tool_versions.json changed.txt; then
              { grep '^My_mods/' changed.txt || true; } | cut -d/ -f1,2 | sort -u | sed 's|$|/|' > projects.txt
            fi
          fi
      - name: Compile the mod files
        shell: bash
        run: |
          status=0
          while IFS= read -r file; do
            luac -p "$file" || status=1
          done < <(find My_mods -name '*.lua' -not -path '*/tests/*' | grep -F -f projects.txt)
          exit "$status"
      - name: Run mod tests
        shell: bash
        run: |
          status=0
          while IFS= read -r file; do
            (cd "$(dirname "$file")" && lua "$(basename "$file")") || status=1
          done < <(find My_mods -path '*/tests/test_*.lua' | grep -F -f projects.txt)
          exit "$status"

  check:
    name: Mods and knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare tools
        run: python3 DOCUMENTATION/tools/bootstrap.py --no-luac
      - name: Test the tools
        run: python3 -m unittest discover -s DOCUMENTATION/tests
      - name: Check mods
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # After a forced push the previous commit is gone, and a new branch has none.
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=HEAD~1
          python3 DOCUMENTATION/tools/check.py --no-luac --changed-since "$BASE"
